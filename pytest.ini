[pytest]
# Les tests du noyau de vérification n'importent que app.services.verification (pur) :
# ils tournent sans base de données, sans LLM et sans les dépendances lourdes (torch, chromadb…).
pythonpath = .
testpaths = tests
addopts = -ra
markers =
    llm: test nécessitant un vrai modèle LLM (non déterministe, exclu de la CI par défaut)
